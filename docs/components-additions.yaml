    # ---- add under `schemas:` (with Error, Book, ...) ----
    AuthError:
      type: object
      description: Error shape used by login, register and the auth middleware
      properties:
        error:
          type: string
          example: Not logged in
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Send as `Authorization Bearer <accessToken>` (valid 1 day)
        refreshToken:
          type: string
          description: Valid 7 days
        user:
          $ref: '#/components/schemas/User'
  # ---- add under `components:` (same level as `schemas:`) ----
    parameters:
    Page:
      name: page
      in: query
      description: Page number. Without it, the full list is returned (no pagination).
      schema:
        type: integer
        minimum: 1
        example: 1
    Limit:
      name: limit
      in: query
      description: Items per page (max 50)
      schema:
        type: integer
        minimum: 1
        maximum: 50
        example: 10

    responses:
    BadRequest:
      description: Bad input (missing required field, duplicate value, or invalid id)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not logged in, or the token is missing, invalid or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
    Forbidden:
      description: Logged in, but your role isn't allowed to do this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
    NotFound:
      description: No record with that id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Server or database error (details only in the server log)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too many attempts (10 per 15 minutes per IP)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
