paths:

  /api/health:
    get:
      tags:
      - Health
      summary: Check the API and database
      security: []
      responses:
        '200':
          description: API and database are up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  db:
                    type: string
                    example: ok
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  db:
                    type: string
                    example: unreachable

  /api/auth/register:
    post:
      tags:
      - Auth
      summary: Sign up with email and password
      description: New accounts are always `student`. Only an admin can change a role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_name
              - user_email
              - user_password
              properties:
                user_name:
                  type: string
                  example: Test Student
                user_email:
                  type: string
                  format: email
                  example: student1@test.com
                user_password:
                  type: string
                  format: password
                  minLength: 8
                  example: password123
                user_avatar:
                  type: string
                  example: ''
      security: []
      responses:
        '201':
          description: Account created; returns tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Missing fields, or password shorter than 8 characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '409':
          description: An account with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Could not create account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_email
              - user_password
              properties:
                user_email:
                  type: string
                  format: email
                  example: student1@test.com
                user_password:
                  type: string
                  format: password
                  example: password123
      security: []
      responses:
        '200':
          description: Logged in; copy `accessToken` and click Authorize
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Email and password are required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '401':
          description: Wrong email or password, or the account uses Google sign-in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Could not log in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/auth/google:
    post:
      tags:
      - Auth
      summary: Sign in with Google
      description: Send the ID token (`credential`) from the Google Sign-In button.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - credential
              properties:
                credential:
                  type: string
                  description: Google ID token
      security: []
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Missing Google credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '401':
          description: Google sign-in failed or email not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/me:
    get:
      tags:
      - Auth
      summary: The current user
      security: &id001
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /api/users:
    get:
      tags:
      - Users
      summary: List users
      description: 'Roles: teacher, admin.'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      security: *id001
      responses:
        '200':
          description: OK; `pagination` only with `?page`
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Could not load users
          content:
            application/json:
              schema: &id002
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string

  /api/users/{id}:
    get:
      tags:
      - Users
      summary: Get one user
      description: Yourself, or any user if you are a teacher or admin.
      parameters: &id003
      - name: id
        in: path
        required: true
        description: User id
        schema:
          type: integer
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid user id
          content:
            application/json:
              schema: *id002
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not your account, and not a teacher or admin
          content:
            application/json:
              schema: *id002
        '404':
          description: User not found
          content:
            application/json:
              schema: *id002
    put:
      tags:
      - Users
      summary: Update a user
      description: Yourself or an admin. Only admins can change `user_role`.
      parameters: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_name:
                  type: string
                user_email:
                  type: string
                  format: email
                user_avatar:
                  type: string
                user_role:
                  type: string
                  enum:
                  - student
                  - parent
                  - teacher
                  - admin
      security: *id001
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid id or role
          content:
            application/json:
              schema: *id002
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not your account, or only admins can change roles
          content:
            application/json:
              schema: *id002
        '404':
          description: User not found
          content:
            application/json:
              schema: *id002
        '409':
          description: That email is already in use
          content:
            application/json:
              schema: *id002
    delete:
      tags:
      - Users
      summary: Delete a user
      description: 'Roles: admin.'
      parameters: *id003
      security: *id001
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid id, or you can't delete your own account
          content:
            application/json:
              schema: *id002
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found
          content:
            application/json:
              schema: *id002

